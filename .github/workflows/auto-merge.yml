name: Automerge ✨
on:
  pull_request_target:
    types: [opened]

jobs:
  translations:
    if: (github.actor == 'pressbooks-ops' || github.actor == 'transifex-integration[bot]' || github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]')
    uses: pressbooks/reusable-workflows/.github/workflows/auto-merge.yml@main
    secrets: inherit
